<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142030">
<title>Test console · STEMI Coordination (TEST ONLY)</title>
<link rel="stylesheet" href="/assets/shared/fonts/fonts.css">
<link rel="stylesheet" href="/assets/shared/ds.css">
<style>
/* The test console: TEST ONLY. Not part of the clinical product. */
.testonly { background: var(--warn-soft); border-bottom: 1px solid var(--warn-line); color: var(--warn-text); }
.testonly > div { max-width: var(--page-max); margin: 0 auto; padding: 10px max(var(--s5), var(--safe-r)) 10px max(var(--s5), var(--safe-l)); display: flex; gap: var(--s3); align-items: center; font-weight: 600; flex-wrap: wrap; }
.con { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--s4); align-items: start; }
@media (max-width: 1100px) { .con { grid-template-columns: minmax(0, 1fr); } }
.con__col { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.ctable { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.ctable th { text-align: left; font: 700 var(--fs-xs)/1.3 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ctable td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ctable tr.sel td { background: var(--primary-soft); }
.ctable tr[data-cad] { cursor: pointer; }
.ctable tr[data-cad]:hover td { background: var(--surface-2); }
.ctable tr.sel[data-cad]:hover td { background: var(--primary-soft); }
.ctable .off { color: var(--text-3); }
.tsec td { font-weight: 700; padding-top: 14px; border-bottom: 1px solid var(--line-2); }
.ts td:nth-child(2), .ts td:nth-child(3) { font-family: var(--font-data); white-space: nowrap; text-align: right; }
.ts td:nth-child(3) { color: var(--text-3); }
.aud { list-style: none; margin: 0; padding: 0; max-height: 640px; overflow: auto; font-size: var(--fs-sm); }
.aud li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: var(--s2); padding: 7px 0; border-bottom: 1px solid var(--line); }
.aud li.view { color: var(--text-2); }
.aud .t { font-family: var(--font-data); color: var(--text-2); }
.aud small { display: block; color: var(--text-3); font-size: var(--fs-xs); margin-top: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-md); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--line-2); background: var(--surface); padding: 8px 12px; min-height: 40px; font-weight: 600; font-size: var(--fs-sm); color: var(--text); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--primary); color: #fff; }
.simrow { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: var(--s2) var(--s3); align-items: center; padding: 8px 0; }
@media (max-width: 600px) { .simrow { grid-template-columns: minmax(0, 1fr); } }
.dev { display: flex; gap: var(--s2); align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.up { background: var(--ok); } .dot.down { background: var(--crit); }
.urls code { font: 600 var(--fs-sm) var(--font-data); background: var(--surface-3); padding: 2px 6px; border-radius: var(--r-sm); user-select: all; overflow-wrap: anywhere; }
</style>
<!--APP-->
</head>
<body>
<div class="app">
  <div id="top"></div>
  <div class="testonly" role="note"><div><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19L12 3.5z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></svg>TEST ONLY — this console is a testing tool, not part of the clinical product. Its actions change test data; none of them is a clinical step.</div></div>
  <div id="banner"></div>
  <main class="page" id="main"></main>
</div>
<script src="/assets/shared/rules.js"></script>
<script src="/assets/shared/cad.js"></script>
<script src="/assets/shared/ui.js"></script>
<script src="/assets/shared/clinical.js"></script>
<script src="/assets/shared/live.js"></script>
<script src="/assets/control/control.js"></script>
</body>
</html>
