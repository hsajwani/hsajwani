<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142030">
<title>Crew log in · STEMI Coordination (test)</title>
<link rel="stylesheet" href="/assets/shared/fonts/fonts.css">
<link rel="stylesheet" href="/assets/shared/ds.css">
<!--APP-->
</head>
<body>
<div class="app">
  <div id="top"></div>
  <main class="page" style="max-width:520px">
    <section class="card" style="margin-top:24px"><div class="card__b stack">
      <div><div class="overline">Crew MDT</div><h1 style="margin-top:4px">Log in</h1></div>
      <div class="alert tone-crit" id="err" role="alert" hidden></div>
      <form id="f" class="stack" novalidate>
        <div class="field"><label class="label" for="email">Email</label><input class="input" id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
        <div class="field"><label class="label" for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
        <button class="btn btn--primary btn--lg btn--block" type="submit">Log in</button>
      </form>
      <p class="small muted">Test user: <b class="mono">crew@test.local</b> · <button class="link-btn" type="button" id="fill">Fill in the test user</button></p>
      <p class="small muted">The ER Doctor and Cardiologist screens need no login: open <a href="/er">/er</a> or <a href="/cardiologist">/cardiologist</a>. They record the name the clinician types (prototype only).</p>
      <span class="test-note" style="align-self:flex-start">TEST BUILD · FICTIONAL DATA ONLY · NO REAL PATIENT INFORMATION</span>
    </div></section>
  </main>
</div>
<script src="/assets/shared/rules.js"></script>
<script src="/assets/shared/ui.js"></script>
<script>
(() => {
  const { $, esc, icon, topbar, patch } = UI;
  patch('top', topbar({ role: 'Crew MDT', home: '/', conn: '' }));
  const err = $('#err');
  const show = m => { err.hidden = false; err.innerHTML = icon('alert') + `<div class="alert__body">${esc(m)}</div>`; };
  $('#fill').onclick = () => { $('#email').value = 'crew@test.local'; $('#pw').focus(); };
  $('#f').onsubmit = async e => {
    e.preventDefault(); err.hidden = true;
    if (!$('#email').value.trim() || !$('#pw').value) return show('Enter the email and the password.');
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('#email').value, password: $('#pw').value }) }).catch(() => null);
    if (!r) return show('No connection to the server.');
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return show(d.error || 'Login failed');
    const next = new URLSearchParams(location.search).get('next');
    location.href = next === '/crew' ? next : '/crew';
  };
})();
</script>
</body>
</html>
